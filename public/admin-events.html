<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management - OutlookBookingSync Admin</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <header>
        <h1>Event Management</h1>
        <nav>
            <a href="dashboard">Dashboard</a>
            <a href="admin-mappings">Resource Mappings</a>
            <a href="admin-events" class="active">Event Management</a>
            <a href="admin-tenants">Tenants</a>
            <a href="admin-keys">API Keys</a>
        </nav>
    </header>

    <main>
        <div id="messageArea"></div>

        <!-- Event Query Section -->
        <div class="form-section">
            <h2>Query Events</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="tenantSelect">Tenant</label>
                    <select id="tenantSelect">
                        <option value="">Default</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bridgeSelect">Bridge</label>
                    <select id="bridgeSelect">
                        <option value="">Select Bridge</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="resourceSelect">Resource</label>
                    <div class="resource-search-container">
                        <input type="text" id="resourceSearch" placeholder="Type to search resources..." autocomplete="off">
                        <select id="resourceSelect" size="5" style="display: none;">
                            <option value="">Select Resource</option>
                        </select>
                        <div id="resourceDropdown" class="resource-dropdown" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-group narrow">
                    <br>
                    <button type="button" class="btn btn-primary" onclick="loadEvents()">Load Events</button>
                </div>
            </div>
        </div>

        <!-- Event Actions Section -->
        <div class="form-section">
            <h2>Event Actions</h2>
            <div class="btn-group">
                <button type="button" class="btn btn-success" onclick="openCreateEventModal()">Create New Event</button>
                <button type="button" class="btn btn-warning" onclick="refreshEvents()">Refresh Events</button>
            </div>
        </div>

        <!-- Events List Section -->
        <div class="form-section">
            <h2>Events <span id="eventCount">(0)</span></h2>
            <div id="eventsContainer">
                <p class="muted">Select a bridge and resource, then click "Load Events" to see events.</p>
            </div>
            <!-- Pagination Controls -->
            <div id="paginationContainer" class="pagination-container" style="display: none;">
                <div class="pagination-info">
                    <span id="paginationInfo">Showing 0 events</span>
                </div>
                <div class="pagination-controls">
                    <div class="page-size-control">
                        <label for="pageSize">Page size:</label>
                        <select id="pageSize" class="pagination-input" onchange="changePageSize()">
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                        </select>
                    </div>
                    <button type="button" class="pagination-btn" id="firstPageBtn" onclick="goToPage(1)" disabled>First</button>
                    <button type="button" class="pagination-btn" id="prevPageBtn" onclick="goToPreviousPage()" disabled>Previous</button>
                    <span>Page</span>
                    <input type="number" id="currentPageInput" class="pagination-input" min="1" value="1" onchange="goToInputPage()">
                    <span>of <span id="totalPages">1</span></span>
                    <button type="button" class="pagination-btn" id="nextPageBtn" onclick="goToNextPage()" disabled>Next</button>
                    <button type="button" class="pagination-btn" id="lastPageBtn" onclick="goToLastPage()" disabled>Last</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Event Create/Edit Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Create Event</h3>
                <span class="close" onclick="closeEventModal()">&times;</span>
            </div>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Title *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventStartDate">Start Date *</label>
                        <input type="date" id="eventStartDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventStartTime">Start Time *</label>
                        <input type="time" id="eventStartTime" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventEndDate">End Date *</label>
                        <input type="date" id="eventEndDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventEndTime">End Time *</label>
                        <input type="time" id="eventEndTime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Event description..."></textarea>
                </div>
                <div class="form-group">
                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" placeholder="Event location...">
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Save Event</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>


    <!-- JavaScript -->
    <script src="js/event-management.js"></script>
</body>
</html>
