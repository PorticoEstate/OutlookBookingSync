<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Bridge Service - Monitoring Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="header">
        <h1>Calendar Bridge Service</h1>
    <p>Real-time Monitoring Dashboard · <a href="/admin-tenants">Tenants</a> · <a href="/admin-keys">API Keys</a> · <a href="/admin-configs">Bridge Configs</a></p>
    </header>

    <div class="container">
        <div class="refresh-info">
            <span id="lastUpdate">Loading...</span> | Auto-refresh every 30 seconds
        </div>

        <div class="tenant-switcher" style="margin: 8px 0; display:flex; align-items:center; gap:8px;">
            <label for="tenantIdSelect">Tenant</label>
            <select id="tenantIdSelect" style="padding:4px 6px; min-width:220px;">
                <option value="">Loading tenants…</option>
            </select>
            <button id="clearTenantBtn" title="Clear tenant and use DEFAULT_TENANT_ID if configured">Clear</button>
            <small class="note" id="tenantHint" style="color:#666;">All requests include X-Tenant-Id when set.</small>
        </div>

        <div id="systemOverview" class="overview-stats">
            <div class="loading">Loading system overview</div>
        </div>

        <div id="dashboardContent" class="dashboard-grid">
            <div class="loading">Loading dashboard data</div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
